name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter md2jira-core build

      - name: Build CLI
        run: pnpm --filter md2jira-cli build

      - name: Dependency security audit
        # Fail the build if any dependency has a known HIGH or CRITICAL vulnerability.
        # Use --audit-level=high to allow low/moderate advisories that have no fix yet.
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (core + web with coverage thresholds)
        run: pnpm test:coverage

      - name: Test CLI
        run: pnpm --filter md2jira-cli test

      - name: Build web (for bundle-size check)
        run: pnpm --filter web build

      - name: Bundle size gate
        # Fail if any single JS chunk exceeds 500 kB (gzip ~150 kB).
        # Adjust the threshold here as the app grows deliberately.
        run: |
          THRESHOLD_KB=500
          FAILED=0
          for f in apps/web/dist/assets/*.js; do
            SIZE_KB=$(( $(wc -c < "$f") / 1024 ))
            echo "  $f — ${SIZE_KB} kB"
            if [ "$SIZE_KB" -gt "$THRESHOLD_KB" ]; then
              echo "::error file=$f::Bundle chunk exceeds ${THRESHOLD_KB} kB threshold (${SIZE_KB} kB)"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Upload core coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: packages/core/coverage/lcov.info
          flags: core

      - name: Upload web coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: apps/web/coverage/lcov.info
          flags: web

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: ci
    # Run on every push and PR.
    # PRs: Chromium only — fast feedback (~1–2 min).
    # main: all three browsers — full cross-browser coverage.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter md2jira-core build

      - name: Install Playwright browsers
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm --filter web exec playwright install --with-deps chromium firefox webkit
          else
            pnpm --filter web exec playwright install --with-deps chromium
          fi

      - name: Run E2E tests
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm --filter web test:e2e
          else
            pnpm --filter web test:e2e --project=chromium
          fi

      - name: Visual regression (runs only when baselines are committed)
        if: hashFiles('apps/web/e2e/__snapshots__/*.png') != ''
        run: pnpm --filter web test:e2e:visual

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter md2jira-core build

      - name: Build web
        run: pnpm --filter web build

      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: .lighthouserc.json
