<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>md2jira-previewer — Convert Markdown to Jira Wiki Markup & ADF</title>
    <meta
      name="description"
      content="Free online tool to convert Markdown to Jira Wiki Markup and Atlassian Document Format (ADF). Preview, copy as rich text, and paste directly into Jira Cloud or Jira Server."
    />
    <meta
      name="keywords"
      content="markdown to jira, jira wiki markup, adf converter, atlassian document format, markdown converter, jira cloud, jira formatting"
    />
    <meta name="author" content="md2jira-previewer" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- `data-vite-canonical` marks this tag for the canonicalUrlPlugin in vite.config.ts.
         At build time, set VITE_CANONICAL_URL=https://your-domain.com to override the
         href. Falls back to the GitHub Pages URL used in the default deployment. -->
    <link rel="canonical" href="https://danielmontes9.github.io/md2jira" data-vite-canonical />
    <link rel="preconnect" href="https://cdn.buymeacoffee.com" crossorigin />

    <!-- Content Security Policy
         - script-src 'self': allows only scripts served from the same origin
           (including /theme-init.js and Vite's main bundle). 'unsafe-inline' is
           no longer needed because the theme-detection snippet was moved to
           public/theme-init.js.
         - style-src 'unsafe-inline': REQUIRED — Tailwind CSS v4 injects styles at
           runtime via CSSOM (`CSSStyleSheet.insertRule`). There is no Vite plugin
           that generates CSP nonces/hashes for Tailwind's runtime injection.
           When Tailwind ships a static-extraction mode, replace 'unsafe-inline'
           with a nonce-based approach. Track: https://github.com/tailwindlabs/tailwindcss/discussions
         - img-src: allow data URIs (favicons) + Buy Me a Coffee CDN.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.buymeacoffee.com; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none';"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="md2jira-previewer — Markdown to Jira Converter" />
    <meta
      property="og:description"
      content="Convert Markdown to Jira Wiki Markup and Atlassian Document Format (ADF). Preview and copy for Jira Cloud or Server."
    />
    <meta property="og:url" content="https://danielmontes9.github.io/md2jira" />
    <meta property="og:site_name" content="md2jira" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="md2jira-previewer — Markdown to Jira Converter" />
    <meta
      name="twitter:description"
      content="Convert Markdown to Jira Wiki Markup and ADF. Preview and copy for Jira Cloud or Server."
    />

    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <script src="/theme-init.js"></script>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "md2jira",
        "description": "Convert Markdown to Jira Wiki Markup and Atlassian Document Format (ADF)",
        "url": "https://danielmontes9.github.io/md2jira",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "browserRequirements": "Requires a modern web browser"
      }
    </script>
  </head>
  <body class="min-h-screen bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100">
    <noscript>
      <div style="padding: 2rem; text-align: center">
        <h2 style="font-size: 1.25rem; font-weight: 700">md2jira-previewer</h2>
        <p>
          Convert Markdown to Jira Wiki Markup and Atlassian Document Format (ADF). Please enable
          JavaScript to use this tool.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
